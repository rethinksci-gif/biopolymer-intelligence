# Terms and standards. Standard titles are copied as published by the issuing body (retrieved 2026-10-20:
# ISO open-data deliverables metadata, CEN search, ASTM product pages, ISCC website). Scopes are not
# paraphrased; follow the link for the document itself.
terms:
  - {term: TRL, text: "Technology readiness level. Recorded only when a source states it (with its scope), or as an estimate labelled as such; otherwise 'Not reported'."}
  - {term: Nameplate capacity, text: "The design capacity of a plant. It is not output: plants may be announced, under construction, commissioned or operating below capacity. This site never shows nameplate capacity as production."}
  - {term: Mass balance, text: "A chain-of-custody model that attributes a bio-based (or recycled) share to products by bookkeeping, without physical segregation. Attributed content is recorded separately from measured bio-based carbon."}
  - {term: Biogenic carbon, text: "Carbon that came from biomass. How an LCA accounts for it (uptake, storage, release) must be stated."}
  - {term: Functional unit, text: "The quantified function an LCA compares (for example one bottle of a given volume), so that products are compared on the same basis."}
  - {term: System boundary, text: "The life-cycle stages included in an LCA, for example cradle-to-gate or cradle-to-grave."}
  - {term: Cradle-to-gate, text: "An LCA boundary from raw-material extraction to the factory gate, excluding use and end of life."}
  - {term: ROP, text: "Ring-opening polymerisation: cyclic monomers such as lactide open and add to a growing chain."}
  - {term: ROCOP, text: "Ring-opening copolymerisation, for example of epoxides with CO₂ or with cyclic anhydrides."}
  - {term: Tg, text: "Glass transition temperature: above it, amorphous regions soften from glassy to rubbery."}
  - {term: Tm, text: "Melting temperature of the crystalline regions."}
  - {term: HDT, text: "Heat deflection temperature: the temperature at which a test bar deflects a set amount under a stated load."}
  - {term: scPLA, text: "Stereocomplex PLA: a co-crystal of poly(L-lactide) and poly(D-lactide)."}
  - {term: mcl-PHA, text: "Medium-chain-length polyhydroxyalkanoates, with longer side chains than PHB."}
  - {term: Vitrimer, text: "A covalently crosslinked network whose bonds exchange at high temperature, so it can be reshaped while remaining a network."}
  - {term: NIPU, text: "Non-isocyanate polyurethane, typically from cyclic carbonates and amines."}
  - {term: ND, text: "Not disclosed: the source does not report the value, or no sourced value exists yet. ND never means zero."}
labels:
  - {term: machine-triaged, text: "A discovery record screened by DeepSeek flash. The quote is checked against the title or abstract; nothing else is verified."}
  - {term: peer-reviewed, text: "Checked development whose main source is a peer-reviewed paper."}
  - {term: supplier announcement, text: "Checked development based on a company release; claims are attributed, not endorsed."}
  - {term: preprint/patent lead, text: "Not peer-reviewed; recorded as a lead only."}
  - {term: hold, text: "Selected but not publishable yet; the reason is stated."}
  - {term: "Watch / Data gap / Milestone to check", text: "Neutral tracking labels. They do not imply any purchasing, qualification or follow-up decision."}
  - {term: Novelty types, text: "new-chemistry · new-route · new-formulation-or-application · scale-or-supply (one per lead)."}
