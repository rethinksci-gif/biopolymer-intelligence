- id: naturvardsverket-biobaserad
  issuer: Naturvårdsverket (Swedish Environmental Protection Agency)
  title: Vad är biobaserad plast?
  reference: Web page, reviewed 24 June 2026
  date: 2026-06-24
  url: https://www.naturvardsverket.se/amnesomraden/plast/vanliga-begrepp-inom-plast/vad-ar-biobaserad-plast/
  fetch_url: https://www.naturvardsverket.se/amnesomraden/plast/vanliga-begrepp-inom-plast/vad-ar-biobaserad-plast/
  retrieved: 2026-10-20
  language: sv
  quotes:
    - id: definition
      text: "En biobaserad plast är helt eller delvis tillverkad av förnybar råvara som exempelvis trä, majs och sockerbetor."
      translation: "A bio-based plastic is wholly or partly made from renewable raw material such as wood, maize and sugar beet."
    - id: drop-in
      text: "Det finns biobaserade plaster som består av samma polymerer som fossilbaserade motsvarigheter av exempelvis polypropen. De kallas drop-in plaster."
      translation: "There are bio-based plastics made of the same polymers as fossil-based counterparts, for example polypropylene. They are called drop-in plastics."
    - id: no-minimum
      text: "I dagsläget finns inte någon minimigräns för att en plast ska få kallas biobaserad."
      translation: "At present there is no minimum threshold for a plastic to be called bio-based."
    - id: not-degradable
      text: "Den biobaserade plasten behöver inte vara nedbrytbar utan kan ha designats för att vara lika beständig som annan plast."
      translation: "Bio-based plastic need not be degradable; it may have been designed to be as durable as other plastic."
    - id: home-compost
      text: "De allra flesta komposterbara plasterna på marknaden bryts inte heller ner i miljön som råder i en hemkompost, utan det krävs i regel industriell kompostering."
      translation: "The great majority of compostable plastics on the market do not break down in the conditions of a home compost either; industrial composting is usually required."
