cards:
- development: avantium-fdca-flagship-first-batch
  headline: Avantium's FDCA flagship plant makes its first batch
  visual: fdca
  visual_brief: ''
  change: Avantium reports that its Delfzijl FDCA Flagship Plant produced a first FDCA batch on 28 September, after commissioning all major process
    units.
  implication: PEF's key monomer moves from pilot to commercial-scale start-up; the company expects commercial sales toward the end of 2026.
  gap: Design capacity, actual output, qualification results and a bounded LCA are not disclosed; ramp-up is guided at 12-24 months.
- development: pla-pa11-nanosilica-elastomer-toughening
  headline: A bio-based elastomer hybrid toughens a PLA/PA11 blend
  visual: pla-ru
  visual_brief: ''
  change: A Tianjin University / PetroChina lab reports a PLA/PA11 formulation with 61.7 MPa tensile strength, 49.8 kJ/m2 notched impact
    strength and 399 % elongation at break.
  implication: Points to tougher PLA blends for load-bearing parts while keeping the components bio-based, at lab scale only.
  gap: Abstract only - blend ratio, test standards, neat-PLA baseline, heat-resistance data and bio-based content are not reported there.
watchlist:
