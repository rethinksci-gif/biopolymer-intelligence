- id: scope-review
  label: Watch · scope review
  family: Scope review
  focus: false
  name: Drop-ins, mass balance & biocomposites
  tagline: Bio-PE/PP/PET/PA, mass-balance attributed products and biofilled fossil polymers - tracked, never counted as new bio-based polymers.
  scope: Bio-PE/PP/PET/PA, ISCC PLUS mass balance, biofilled fossil polymers. Shown separately and labelled.
  what:
    - Drop-in polymers have the same chemical structure as their fossil counterparts. Siracusa and Blanco review bio-PE, bio-PP and bio-PET as bio-based polymers analogous to petroleum-derived ones.
    - Mass-balance attribution assigns a bio-based share to products through chain-of-custody bookkeeping. The European Commission's policy framework states that this method is not considered suitable for confirming the actual share of bio-based content.
    - A bio-based filler in a fossil polymer matrix is a composite, not a new bio-based polymer.
  chemistry:
    - Drop-ins share structures with incumbents (for example ethylene glycol and terephthalic acid in PET), so chemistry gives no new performance - the change is in feedstock.
  production:
    - Bio-ethanol to ethylene for bio-PE; bio-based ethylene glycol for partly bio-based PET; mass-balance allocation in shared crackers.
  properties:
    - Same as the fossil counterpart for true drop-ins.
  eol:
    bio_based_origin: Measured (radiocarbon) or attributed (mass balance) - always record which.
    biodegradability: Bio-based plastics are not necessarily biodegradable or compostable (European Commission).
    compostability: Not assumed.
    recyclability: Usually the same stream as the fossil counterpart.
  key_players: []
  applications: [same as incumbents]
  challenges:
    - Claim accounting - measured bio-based carbon versus mass-balance attribution.
    - Feedstock sustainability and land use.
  challenge_links: [claims, feedstock, lca]
  structures: [eg, tpa]
  refs: [siracusa2020, nakajima2017, lambert2017]
  support:
    - {ref: siracusa2020, quote: "bio-based polymers analogous to petroleum-derived ones"}
  scan:
    crossref: ["bio-based polyethylene", "mass balance bio-based plastics", "bio-attributed polymer"]
    news: ["bio-attributed polymer ISCC PLUS", "bio-based polyethylene plant", "mass balance bio-based plastic", "bioplastic plant closure", "bioplastic project cancelled"]
