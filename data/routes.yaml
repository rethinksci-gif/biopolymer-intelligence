  chemistry:
    - Byrne et al. report alternating copolymerisation of limonene oxide and CO₂ with zinc catalysts to a regioregular polycarbonate with more than 99 % carbonate linkages.
  production:
    - Melt transesterification for isosorbide polycarbonates; catalytic ROCOP for CO₂-based polycarbonates (see Chemistry).
  properties:
