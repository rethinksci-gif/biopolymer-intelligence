- id: polyurethanes
  label: Urethanes
  family: Urethanes
  focus: false
  name: Bio-polyurethanes & NIPU
  tagline: Bio-based polyols and isocyanates, and non-isocyanate polyurethanes from cyclic carbonates and amines.
  scope: Bio-polyols (castor, other plant oils, lignin), bio-isocyanates (for example PDI), cyclic carbonate + amine NIPU.
  what:
    - Conventional polyurethanes are made from polyisocyanates and polyols. Rokicki et al. review non-isocyanate polyurethanes (NIPU), which avoid isocyanates, and identify poly(hydroxy-urethane)s from cyclic carbonates and amines as the most developed route.
  chemistry:
    - Polyaddition of a polyol to an isocyanate gives urethane links. In NIPU, an amine opens a cyclic carbonate to give a hydroxyurethane (see Chemistry).
  production:
    - Bio-polyols from plant oils or lignin; bio-based diisocyanates such as pentamethylene diisocyanate; cyclic carbonates such as glycerol carbonate.
  properties:
    - Not summarised here.
  eol:
    bio_based_origin: Grade-specific; usually only part of the formulation is bio-based.
    biodegradability: Not assessed here.
    compostability: Not assessed here.
    recyclability: Not assessed here.
  key_players: []
  applications: [foams, coatings, adhesives (as cited)]
  challenges:
    - Residual fossil components (isocyanate, amine) in "bio-based" PU.
    - Slower cure and lower molar mass in many NIPU systems.
  challenge_links: [claims, processing, durability]
  structures: [glycerol-carbonate, pdi, ricinoleic, coniferyl]
  refs: [rokicki2015, upton2016]
  support:
    - {ref: rokicki2015, quote: "poly(hydroxy‐urethane)s, based upon multicyclic carbonates and aliphatic amines"}
  scan:
    crossref: ["non-isocyanate polyurethane", "bio-based polyol polyurethane", "bio-based isocyanate", "lignin polyurethane"]
    news: ["bio-based polyurethane launch", "non-isocyanate polyurethane"]

- id: thermosets
  label: Networks
  family: Networks
  focus: false
  name: Bio-based thermosets & vitrimers
  tagline: Epoxies from vanillin and plant oils, itaconic and furan networks, cardanol resins and dynamic covalent networks.
  scope: Vanillin/lignin epoxies, epoxidised plant oils, itaconic and furan Diels–Alder networks, cardanol benzoxazines, dynamic covalent networks.
  what:
    - Auvergne et al. review bio-based thermosetting epoxies; Fache et al. describe vanillin as a key intermediate for bio-based polymers.
    - Fortman et al. note that covalent cross-links make thermosets robust but prevent recycling into similar-value goods, and review recyclable cross-linked designs.
  chemistry:
    - Montarnal et al. reported networks that are stable like thermosets yet can be reshaped in the melt - the vitrimer concept based on exchangeable covalent bonds.
    - Robert and Friebel review itaconic acid as an unsaturated building block for renewable polyesters.
  production:
    - Curing of bio-based epoxy monomers with hardeners; free-radical curing of unsaturated polyesters; dynamic exchange chemistry for vitrimers.
  properties:
    - Not summarised here.
  eol:
    bio_based_origin: Grade-specific; hardeners and catalysts are often fossil-based.
    biodegradability: Not assessed here.
    compostability: Not assessed here.
    recyclability: Conventional thermosets cannot be remelted; vitrimers and other dynamic networks are designed to be reprocessed (Fortman et al.).
  key_players: []
  applications: [composites, coatings, adhesives (as cited)]
  challenges:
    - Long-term stability of inherently dynamic networks (Fortman et al.).
    - Fossil hardeners and residual fossil content.
  challenge_links: [durability, claims, eol]
  structures: [vanillin, itaconic, furfuryl-alcohol, cardanol]
  refs: [auvergne2014, fache2015, fortman2018, montarnal2011, robert2016]
  support:
    - {ref: fortman2018, quote: "they also prevent recycling of these materials into similar-value goods"}
    - {ref: fortman2018, quote: "long-term environmental stability of inherently dynamic polymers"}
    - {ref: montarnal2011, quote: "A polymer shows thermoset-like stability while displaying melt processability like that of a thermopolymer."}
  scan:
    crossref: ["vanillin epoxy", "vitrimer bio-based", "epoxidized plant oil thermoset", "itaconic acid thermoset", "cardanol benzoxazine"]
    news: ["bio-based epoxy resin launch", "recyclable thermoset vitrimer"]

- id: natural-polymers
  label: Modified natural polymers
  family: Modified natural polymers
  focus: false
  name: Cellulose, lignin, starch, protein & chitosan polymers
  tagline: Materials made by modifying polymers that nature already builds - shown by representative units only.
  scope: Cellulose esters, thermoplastic starch, lignin-based polymers, protein plastics, chitosan.
  what:
    - Klemm et al. describe cellulose as a linear homopolymer of D-glucose units with broad capacity for chemical modification, including cellulose esters and ethers.
    - Zhang et al. report that starch becomes thermoplastic with plasticisers, heat and shear; Verbeek and van den Berg describe how proteins are extruded into thermoplastics with plasticisers.
    - Upton and Kasko review polymers made from lignin, monolignols and lignin-derived chemicals such as vanillin.
  chemistry:
    - Structures on this site show a representative repeat or model unit (glucopyranose, glucosamine, coniferyl alcohol, lysine). Natural polymers are never drawn as invented full structures.
  production:
    - Esterification or etherification of cellulose; plasticisation of starch and proteins in extrusion; functionalisation of lignin.
  properties:
    - Zhang et al. report that most thermoplastic starch has a glass transition between about -75 and 10 °C and tensile strength typically below 6 MPa.
  eol:
    bio_based_origin: Bio-based backbone; additives and modifying reagents may not be.
    biodegradability: Grade- and modification-specific; not assessed here.
    compostability: Not assessed here.
    recyclability: Not assessed here.
  key_players: []
  applications: [films, coatings, moulded goods (as cited)]
  challenges:
    - Moisture sensitivity of starch and protein materials.
    - Low tensile strength of thermoplastic starch.
  challenge_links: [moisture, toughness, feedstock]
  structures: [beta-glucose, alpha-glucose, coniferyl, glucosamine, l-lysine]
  refs: [klemm2005, zhang2014, verbeek2010, upton2016, rinaudo2006, isikgor2015]
  support:
