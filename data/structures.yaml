# Chemical structure library. Rendered to SVG by `python -m scanner structures` (RDKit, build time).
# Verification (the build fails on any mismatch):
#  - `cid`: the SMILES's InChIKey must equal PubChem's InChIKey for that CID (cached in data/cache/pubchem.json)
#    and the stored `inchikey`.
#  - `hydrolysis`: repeat units (polymer SMILES with * attachment points) are capped (-O*/-N* -> H, C(*)=O -> COOH),
#    hydrolysed at every ester/amide bond, and the fragments must be exactly the listed library structures,
#    each of which is PubChem-verified. This catches stereochemistry or connectivity errors in repeat units.
# role_label is one of: monomer, repeat unit, representative unit, feedstock, catalyst.
# Natural polymers are shown by a representative unit, never an invented full structure.

# --- PLA ---------------------------------------------------------------
- id: lactic-acid
  name: L-Lactic acid
  role_label: monomer
  role: Fermentation product and parent hydroxy acid of PLA; the (S)-enantiomer.
  smiles: C[C@H](O)C(=O)O
  cid: 107689
  inchikey: JVTAAEKCZFNVCJ-REOHCLBHSA-N
  routes: [pla]
  ref: auras2004
- id: l-lactide
  name: L-Lactide
  role_label: monomer
  role: Cyclic dimer of L-lactic acid; ring-opening polymerisation of lactide gives high-molar-mass PLA.
  smiles: C[C@H]1C(=O)O[C@H](C(=O)O1)C
  cid: 107983
  inchikey: JJTUDXZGHPGLLC-IMJSIDKUSA-N
  routes: [pla]
  ref: dechycabaret2004
- id: pla-ru
  name: Poly(L-lactide)
  role_label: repeat unit
  role: Repeat unit of PLLA. Hydrolysis returns L-lactic acid, which fixes the stereocentre as (S).
  smiles: "*O[C@@H](C)C(*)=O"
  hydrolysis: [lactic-acid]
  routes: [pla]
  ref: tsuji2005
- id: sn-oct2
  name: Tin(II) 2-ethylhexanoate (Sn(Oct)₂)
  role_label: catalyst
  role: Classic catalyst for lactide ROP; forms the active tin alkoxide with an alcohol co-initiator.
  smiles: CCCCC(CC)C(=O)[O-].CCCCC(CC)C(=O)[O-].[Sn+2]
  cid: 9318
  inchikey: KSBAEPSJVUENNK-UHFFFAOYSA-L
  routes: [pla]
  ref: kowalski2000

